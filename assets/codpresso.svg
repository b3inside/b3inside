<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 108" width="760" height="108" role="img" aria-labelledby="title desc">
  <title id="title">Codpresso</title>
  <desc id="desc">A cup of espresso from the Codpresso app illustrates the Codex usage meter.</desc>
  <style>
    :root { --paper: #f3e9dd; --ink: #312218; --line: #d9cabb; --accent: #9e542a; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #2c221d; --ink: #fff1e3; --line: #554131; --accent: #e9a070; }
    }
    .title { font: 39px Georgia, "Times New Roman", serif; fill: var(--ink); }
    
    .steam { opacity: .44; animation: rise 2.25s ease-out 2; }
    .steam-second { animation-delay: .22s; }
    .meter-fill { transform-origin: 428px 54px; animation: pour 1.2s ease-out; }
    @keyframes rise {
      0% { opacity: .15; transform: translateY(5px); }
      35% { opacity: .84; }
      100% { opacity: .1; transform: translateY(-7px); }
    }
    @keyframes pour { from { transform: scaleX(.35); } to { transform: scaleX(1); } }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <rect x=".5" y=".5" width="759" height="107" rx="8" fill="var(--paper)" stroke="var(--line)"/>
  <text class="title" x="30" y="67">Codpresso</text>
  <defs><clipPath id="photo"><rect x="531" y="1" width="163" height="106"/></clipPath></defs>
  <g clip-path="url(#photo)">
    <image href="data:image/jpeg;base64," x="531" y="0" width="163" height="108" preserveAspectRatio="xMidYMid slice"/>
    <g fill="none" stroke="#f7e6cb" stroke-width="1.7" stroke-linecap="round">
      <path class="steam" d="M606 24c-8-6 8-10 2-15"/>
      <path class="steam steam-second" d="M618 26c-7-5 5-10 3-15"/>
    </g>
  </g>
  <rect x="428" y="51" width="78" height="6" rx="3" fill="var(--line)"/>
  <rect class="meter-fill" x="428" y="51" width="54" height="6" rx="3" fill="var(--accent)"/>
  <path d="M715 54h17m-6-6 6 6-6 6" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
